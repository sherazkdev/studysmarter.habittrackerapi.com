# Upstream: Next.js (PM2) on port 3012
# Install: sudo cp deploy/study-smarter-api/study-smarter-api.conf /etc/nginx/sites-available/study-smarter-api
#          sudo ln -sf /etc/nginx/sites-available/study-smarter-api /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
#
# Folder + site name: study-smarter-api (easy to find if domain changes)

upstream study_smarter_api_upstream {
    server 127.0.0.1:3012;
    keepalive 32;
}

# HTTP — use for Certbot (next step: SSL)
server {
    listen 80;
    listen [::]:80;
    server_name studysmarter.habittrackerapi.com;

    client_max_body_size 16M;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://study_smarter_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}

